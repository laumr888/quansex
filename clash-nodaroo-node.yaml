# Nodaroo 悉尼节点（双协议）
# 服务器: Proxy Node（澳大利亚 Sydney AU2）
# 出口 IP: 16.179.53.161
# 分流: 局域网/国内/香港直连, 广告拦截, 其余走节点

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: "Nodaroo-Hy2"
    type: hysteria2
    server: au2.nodaroo.fun
    port: 2469
    password: "NdHy2-9f3Kd8xQ-2026"
    sni: au2.nodaroo.fun
    skip-cert-verify: true

  - name: "Nodaroo-VLESS"
    type: vless
    server: au2.nodaroo.fun
    port: 2469
    uuid: 7f3e9a1c-4b2d-4e8a-9c6e-1d5a3b7e9f02
    udp: true
    flow: xtls-rprx-vision
    tls: true
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 1L_BMeHjg0yBb3yr2edYyvqrdFoqEf7i3BkQrrAgKlA
      short-id: ""

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Nodaroo-Hy2"
      - "Nodaroo-VLESS"
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,HK,DIRECT
  - MATCH,PROXY
