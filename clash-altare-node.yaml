# Altare 斯德哥尔摩节点（双协议）
# 服务器: altare-free-server（瑞典 Stockholm, AWS eu-north-1）
# 出口 IP: 13.62.127.206
# Altare-VLESS: TCP, 稳定保底
# Altare-Hy2:   UDP/Hysteria2, 高延迟线路提速, 若连不上说明平台不放行 UDP, 用 VLESS 即可
# 分流: 局域网/国内/香港直连, 广告拦截, 其余走节点

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: "Altare-VLESS"
    type: vless
    server: se-sto10.tryaltare.ai
    port: 25239
    uuid: 1f2ef094-1220-4a7c-9559-3b66fa331a68
    network: tcp
    udp: true
    tls: true
    skip-cert-verify: true
    servername: www.microsoft.com
    client-fingerprint: chrome

  - name: "Altare-Hy2"
    type: hysteria2
    server: se-sto10.tryaltare.ai
    port: 25239
    password: uzQZiMO5nKwmGXoDJwGKPY2p
    sni: www.microsoft.com
    skip-cert-verify: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - Altare-Hy2
      - Altare-VLESS
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,HK,DIRECT
  - MATCH,PROXY
