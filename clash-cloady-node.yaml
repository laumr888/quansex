# Cloady 美西节点
# 服务器: ljx111cloady（美国西部 US West, Cloady）
# 分流: 局域网/国内/香港直连, 广告拦截, 其余走节点

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: Cloady-Node
    type: vless
    server: ljx111cloady-eo3429fa-tony0976.cloady.io
    port: 443
    uuid: 721d7853-7cfe-4334-896f-566d6e7a3bb7
    network: ws
    tls: true
    udp: true
    servername: ljx111cloady-eo3429fa-tony0976.cloady.io
    ws-opts:
      path: /a8f3-media-streak
      headers:
        Host: ljx111cloady-eo3429fa-tony0976.cloady.io

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Cloady-Node
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,HK,DIRECT
  - MATCH,PROXY
